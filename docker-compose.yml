services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env file}
      - DB_PATH=/app/data/games.db
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - DEMO_GAME_ID=${DEMO_GAME_ID:-}
    volumes:
      - app-data:/app/data
      - mortal-files:/app/mortal_analysis
      - ./app.py:/app/app.py:ro
      - ./db:/app/db:ro
      - ./lib:/app/lib:ro
      - ./routes:/app/routes:ro
      - ./scripts:/app/scripts:ro
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--timeout", "120", "--reload", "app:app"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  app-data:
  mortal-files:
