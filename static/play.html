<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haipai — Mahjong Trainers</title>
  <meta name="description" content="Two free mahjong drills: read waits at speed, and remember which tiles are safe against a riichi. No account needed.">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style-theme.css">
  <link rel="stylesheet" href="/static/style-layout.css">
  <link rel="stylesheet" href="/static/style-board-display.css">
  <link rel="stylesheet" href="/static/style-minigame.css">
  <link rel="stylesheet" href="/static/style-waits-trainer.css">
  <link rel="stylesheet" href="/static/style-defense-trainer.css">
</head>
<body>
  <!--
    Public minigame arcade. No sidebar, mailbox, admin or game list — the same
    "separate minimal shell rather than the SPA in a degraded mode" call as
    static/shared.html, so there is no authenticated surface here to leak.
    Served by /play (routes/pages.py), which bounces logged-in visitors to the
    real app. Bootstrap + hash router: static/js/play-view.js.
  -->
  <div class="app">
    <div class="main">
      <div class="play-banner">
        <a class="brand-mini" href="/"><img src="/static/mascot.svg" alt=""><span class="brand-word">Haipai</span></a>
        <div class="play-tabs">
          <button type="button" class="btn" data-play-tab="waits-trainer" data-action="showWaitsTrainer">Waits</button>
          <button type="button" class="btn" data-play-tab="defense-trainer" data-action="showDefenseTrainer">Defense</button>
        </div>
        <span class="spacer"></span>
        <a class="btn btn-secondary" href="/login">Log in</a>
        <a class="btn btn-primary" href="/register">Sign up</a>
      </div>
      <div class="content" id="content">
        <div class="empty-state">Loading…</div>
      </div>
      <footer class="play-footer">
        <p>Free mahjong drills from <a href="/">Haipai</a> — upload a Mortal analysis to review your own games.</p>
        <p><a href="/impressum">Impressum</a> &middot; <a href="/imprint">Imprint</a> &middot; <a href="/datenschutz">Datenschutz</a> &middot; <a href="/privacy">Privacy</a></p>
      </footer>
    </div>
  </div>

  <!-- Same non-module, load-order-matters arrangement as index.html, cut down
       to what the two trainers actually reach for: the action registry, tile
       rendering, escapeHtml, the API client (for apiPost, unused here but
       referenced), and the shared minigame modules. -->
  <script src="/static/js/actions.js"></script>
  <script src="/static/js/html-escape.js"></script>
  <script src="/static/js/tiles.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/minigame-shell.js"></script>
  <script src="/static/js/minigame-audio.js"></script>
  <script src="/static/js/waits-trainer.js"></script>
  <script src="/static/js/defense-trainer.js"></script>
  <script src="/static/js/play-view.js"></script>
</body>
</html>
