<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Mahjong tile body -->
  <rect x="10" y="20" width="100" height="130" rx="12" ry="12" fill="#e8e0d0" stroke="#8b7355" stroke-width="2.5"/>
  <!-- Inner border (tile face) -->
  <rect x="18" y="28" width="84" height="114" rx="6" ry="6" fill="#f5f0e8" stroke="#c4b59a" stroke-width="1.5"/>

  <!-- Face - Eyes -->
  <ellipse cx="42" cy="72" rx="9" ry="11" fill="#2c2c2c"/>
  <ellipse cx="78" cy="72" rx="9" ry="11" fill="#2c2c2c"/>
  <!-- Eye highlights -->
  <ellipse cx="45" cy="67" rx="3.5" ry="4" fill="#fff"/>
  <ellipse cx="81" cy="67" rx="3.5" ry="4" fill="#fff"/>
  <!-- Small lower highlights -->
  <ellipse cx="40" cy="76" rx="2" ry="2" fill="#fff" opacity="0.6"/>
  <ellipse cx="76" cy="76" rx="2" ry="2" fill="#fff" opacity="0.6"/>

  <!-- Eyebrows (friendly, slightly raised) -->
  <path d="M30 56 Q42 48 54 56" fill="none" stroke="#5a4a3a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M66 56 Q78 48 90 56" fill="none" stroke="#5a4a3a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mouth (friendly smile) -->
  <path d="M42 98 Q60 114 78 98" fill="none" stroke="#5a4a3a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="32" cy="90" rx="8" ry="5" fill="#e8a0a0" opacity="0.4"/>
  <ellipse cx="88" cy="90" rx="8" ry="5" fill="#e8a0a0" opacity="0.4"/>

  <!-- Kanji on forehead: 牌 (pai/tile) -->
  <text x="60" y="48" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#c0392b" opacity="0.7">牌</text>

  <!-- Small arms/hands sticking out from sides -->
  <!-- Left arm -->
  <path d="M10 85 Q0 80 4 72" fill="none" stroke="#8b7355" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="3" cy="70" r="4" fill="#e8e0d0" stroke="#8b7355" stroke-width="1.5"/>
  <!-- Right arm (waving) -->
  <path d="M110 80 Q122 70 118 60" fill="none" stroke="#8b7355" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="118" cy="58" r="4" fill="#e8e0d0" stroke="#8b7355" stroke-width="1.5"/>
</svg>