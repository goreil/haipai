  <style>
    /* This page has no sidebar, so .main takes the full .app width on its own. */
    .shared-banner {
      background: #103a4a;
      color: #bfe8ff;
      padding: 10px 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2a7aa3;
    }
    .shared-banner .brand-mini {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      color: #fff;
    }
    .shared-banner .brand-mini img { width: 22px; height: 22px; }
    .shared-banner .spacer { flex: 1; }
  </style>
