<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haipai</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style-theme.css">
  <link rel="stylesheet" href="/static/style-layout.css">
  <link rel="stylesheet" href="/static/style-game-detail.css">
  <link rel="stylesheet" href="/static/style-board-display.css">
</head>
<body>
  <div class="app">
    <div class="sidebar collapsed">
      <div class="sidebar-header">
        <div class="sidebar-brand" data-action="navigateHome" style="cursor:pointer" title="Back to games">
          <img src="/static/mascot.svg" alt="Haipai" class="brand-mascot">
          <div>
            <h2>Haipai</h2>
            <div id="user-info" class="user-info"></div>
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%" data-action="showAddModal">+ Add Game</button>
      </div>
      <div class="game-list" id="game-list"></div>
    </div>

    <div class="main">
      <div id="impersonate-banner" class="impersonate-banner" style="display:none"></div>
      <div class="toolbar">
        <button class="btn sidebar-toggle" data-action="toggleSidebar" title="Toggle sidebar">&#9776; Games</button>
        <span class="severity-filters" id="severity-filters" style="display:none">
          <label title="Mortal EV gap 0.5–1.0"><input type="checkbox" data-change-action="onToggleMistake"> Mistake</label>
          <label title="Mortal EV gap 0.2–0.5"><input type="checkbox" data-change-action="onToggleLight"> Light</label>
          <label title="Mortal EV gap &lt;0.2 — AI not confident"><input type="checkbox" data-change-action="onToggleUnsure"> Unsure</label>
        </span>
        <div class="spacer"></div>
        <button class="btn" id="trends-btn" data-action="showTrends">Trends</button>

        <div class="mailbox" id="mailbox" style="display:none">
          <button class="btn mailbox-btn" id="mailbox-trigger" title="Mailbox" aria-label="Mailbox">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 12.5V19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6.5"></path>
              <path d="M22 12.5L12.7 5.4a1.5 1.5 0 0 0-1.4 0L2 12.5"></path>
              <path d="M2 12.5h7l1.5 2h3l1.5-2H22"></path>
            </svg>
            <span class="mailbox-badge" id="mailbox-badge" style="display:none">0</span>
          </button>
          <div class="mailbox-panel" role="dialog" aria-label="Mailbox">
            <div class="mailbox-header">
              <h3>Mailbox</h3>
              <div class="actions">
                <button class="mailbox-link" id="mailbox-mark-all-read">Mark all read</button>
              </div>
            </div>
            <div class="mailbox-tabs" role="tablist">
              <button class="mailbox-tab active" data-filter="unread" role="tab">
                Unread <span class="count" id="mailbox-count-unread">0</span>
              </button>
              <button class="mailbox-tab" data-filter="read" role="tab">
                Read <span class="count" id="mailbox-count-read">0</span>
              </button>
            </div>
            <div class="mailbox-list" id="mailbox-list"></div>
          </div>
        </div>

        <div class="toolbar-menu">
          <button class="btn toolbar-menu-btn" data-action="toggleMenu">&#8943;</button>
          <div class="toolbar-dropdown">
            <button data-action="showAccount">Account</button>
            <button data-action="showHelp">Help</button>
            <button id="admin-btn" style="display:none" data-action="showAdmin">Admin</button>
            <button id="stop-impersonating-btn" style="display:none" data-action="adminStopImpersonate">Stop impersonating</button>
            <hr style="border:none;border-top:1px solid var(--border);margin:4px 0">
            <button data-action="openExternal" data-href="/impressum">Impressum</button>
            <button data-action="openExternal" data-href="/datenschutz">Datenschutz</button>
          </div>
        </div>
      </div>
      <div class="content" id="content">
        <div class="empty-state">Select a game to review</div>
      </div>
    </div>
  </div>

  <!-- Add Game Modal -->
  <div class="modal-overlay" id="add-modal" data-action="closeAddModalBackdrop">
    <div class="modal">
      <h3>Add Game</h3>
      <div class="form-group">
        <label>Mortal analysis JSON file</label>
        <input type="file" id="add-file" accept=".json">
      </div>
      <div class="form-group">
        <label>Date (optional, defaults to today)</label>
        <input type="date" id="add-date">
      </div>
      <div class="error" id="add-error"></div>
      <div class="btn-row">
        <button class="btn" data-action="hideAddModal">Cancel</button>
        <button class="btn btn-primary" id="add-submit-btn" data-action="submitAddGame">Add Game</button>
      </div>
      <hr style="border:none;border-top:1px solid var(--border);margin:18px 0">
      <div class="form-group">
        <label>One-click upload bookmarklet</label>
        <p class="form-hint">Drag this link to your bookmark bar. On a mjai.ekyu.moe report page, click it to upload the analysis directly to Haipai.</p>
        <p><a id="upload-bookmarklet" class="btn" href="javascript:void(0)" data-action="preventDefault" draggable="true">Send to Haipai</a></p>
        <div class="tutorial-tabs-wrap">
          <div class="tutorial-tabs">
            <button type="button" class="tutorial-tab active" data-action="switchTutorial" data-tutorial-key="tenhou">Tenhou</button>
            <button type="button" class="tutorial-tab" data-action="switchTutorial" data-tutorial-key="mahjong-soul">Mahjong Soul</button>
            <button type="button" class="tutorial-tab" data-action="switchTutorial" data-tutorial-key="riichi-city">Riichi City</button>
          </div>
          <video class="onboarding-video tutorial-video active" data-tutorial="tenhou" src="/static/haipai-bookmarklet-upload.mp4" controls muted playsinline preload="metadata"></video>
          <video class="onboarding-video tutorial-video" data-tutorial="mahjong-soul" src="/static/haipai_mahjong_soul_guide.mp4" controls muted playsinline preload="metadata"></video>
          <video class="onboarding-video tutorial-video" data-tutorial="riichi-city" src="/static/haipai_riichi_city.mp4" controls muted playsinline preload="metadata"></video>
        </div>
        <p class="form-hint" style="margin-top:6px"><a href="#" data-action="regenerateUploadToken">Regenerate token</a> (invalidates the bookmarklet on every browser).</p>
      </div>
    </div>
  </div>

  <!--
    PR-5d: static/app.js (3839 LOC) was split into static/js/*.js. Load order
    matters because cross-file globals (state, csrfToken, etc.) are top-level
    `var` declarations, and inline onclick handlers throughout the app expect
    every helper to already be on `window` by the time the user clicks. Tiles
    + presentation primitives load first; main.js (init) runs DOMContentLoaded
    after every other file has parsed.
  -->
  <!-- Event-delegation registry (data-action / data-change-action). Loaded
       first so its document-level listeners are attached before any markup
       is interacted with. See docs/backlogs/CSP-HARDENING.md. -->
  <script src="/static/js/actions.js"></script>
  <script src="/static/js/tiles.js"></script>
  <script src="/static/js/severity.js"></script>
  <script src="/static/js/skill-areas.js"></script>
  <script src="/static/js/defense-labels.js"></script>
  <!-- Prep pipeline (Node-portable UMD modules in /static/js/prep/). Load
       order is dependency-driven: leaves first, then prep.js which fans in. -->
  <script src="/static/js/prep/tiles.js"></script>
  <script src="/static/js/prep/parse.js"></script>
  <script src="/static/js/prep/shanten.js"></script>
  <script src="/static/js/prep/defense_kd.js"></script>
  <script src="/static/js/prep/shanten_calc.js"></script>
  <script src="/static/js/prep/furiten.js"></script>
  <script src="/static/js/prep/prep-board-state.js"></script>
  <script src="/static/js/prep/prep-board-yaku.js"></script>
  <script src="/static/js/prep/defense.js"></script>
  <script src="/static/js/prep/prep.js"></script>
  <!-- Opt-in WASM shanten kernel (default off). Async ESM bootstrap; loads
       after prep.js because its adapter depends on haipaiPrepShantenCalc. -->
  <script type="module" src="/static/js/prep/wasm-bootstrap.js"></script>
  <script src="/static/js/vendor/riichi/riichi-bundle.js"></script>
  <script src="/static/js/categorize.js"></script>
  <script src="/static/js/compare-dimensions.js"></script>
  <script src="/static/js/categorize-metadata.js"></script>
  <script src="/static/js/categorize-yaku.js"></script>
  <script src="/static/js/categorize-explanations.js"></script>
  <script src="/static/js/bad-riichi-bars.js"></script>
  <script src="/static/js/board-melds.js"></script>
  <script src="/static/js/board-yaku-panel.js"></script>
  <script src="/static/js/board-discards.js"></script>
  <script src="/static/js/ev-table.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/mistake-card.js"></script>
  <script src="/static/js/game-fetch.js"></script>
  <script src="/static/js/game-concept-breakdown.js"></script>
  <script src="/static/js/game-render.js"></script>
  <script src="/static/js/game-prep.js"></script>
  <script src="/static/js/trends-charts.js"></script>
  <script src="/static/js/trends-analysis.js"></script>
  <script src="/static/js/trends-view.js"></script>
  <script src="/static/js/admin.js"></script>
  <script src="/static/js/account.js"></script>
  <script src="/static/js/mailbox.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
